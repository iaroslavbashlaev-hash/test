<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Хэллоу, Ворлд</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <p class="hello">Хэллоу,</p>
    <div class="world" role="group" aria-label="Ворлд">
      <button type="button" class="letter" data-i="0">В</button>
      <button type="button" class="letter" data-i="1">о</button>
      <button type="button" class="letter" data-i="2">р</button>
      <button type="button" class="letter" data-i="3">л</button>
      <button type="button" class="letter" data-i="4">д</button>
    </div>

    <div
      id="stone"
      class="stone"
      tabindex="0"
      role="button"
      aria-label="Камень: клик — поворот, двойной клик — падение, стрелки — движение"
    ></div>
    <p class="hint">Камень: клик — поворот · двойной клик — падение · стрелки — сдвиг</p>
  </main>
  <script src="stone.js"></script>
</body>
</html>
